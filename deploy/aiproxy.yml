# aiproxy settings for the memesforlaughs.com server, mounted as /app/config/application.yml.
# Keys come from deploy/.env (GEMINI_API_KEY, GROQ_API_KEY, AIPROXY_APP_KEY, ...).
#
# Gemini: use a key from a Google Cloud project WITH billing enabled. The unpaid tier may not serve users in the
# EEA, and Google may use unpaid-tier prompts (including users' photos) to improve its products.
aiproxy:
  virtual-models:
    - name: auto/caption
      description: Meme captions (JSON output)
      attempt-timeout: 45s     # Gemini can take 20-40 s on a caption prompt; Groq (if configured) is the fallback
      unavailable-cooldown: 30s
      candidates:
        - model: gemini/${GEMINI_MODEL:gemini-3.8-flash}
        - model: groq/openai/gpt-oss-120b
          max-tokens: 2048     # Groq free tier: input + max_tokens must stay under 8,000 tokens per minute
    - name: auto/vision
      description: Photo memes (image input)
      attempt-timeout: 60s     # image input takes longer
      unavailable-cooldown: 30s
      candidates:
        - model: gemini/${GEMINI_MODEL:gemini-3.8-flash}
        - model: groq/qwen/qwen3.8-27b
          max-tokens: 2048
  security:
    # The key memecreator calls aiproxy with (chat scope only). Generated on the server into deploy/.env.
    bootstrap-user-key: ${AIPROXY_APP_KEY:}
