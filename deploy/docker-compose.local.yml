# Local test on your own PC (Docker Desktop on Windows/Mac, or Docker on Linux).
# Published through the named Cloudflare Tunnel (memesforlaughs.com) when CLOUDFLARE_TUNNEL_TOKEN is set in
# deploy/.env, otherwise through a Quick Tunnel (docker-compose.quicktunnel.yml): a temporary
# https://<random>.trycloudflare.com address, no Cloudflare account needed.
# Start it with deploy/local-up.cmd (Windows) or:
#   docker compose --env-file .env --env-file <aiproxy folder>/.env -f docker-compose.yml -f docker-compose.local.yml up -d --build
# Differences from the server setup:
#   - data lives in Docker volumes (memecreator-data, postgres-data) instead of /data/...
#   - templates come straight from your folders (MEME_TEMPLATES_HOST, MEME_STORAGE_HOST in deploy/.env)
#   - the site is also on http://localhost:8088
#   - on the Quick Tunnel, Google/Facebook sign-in can't work (random address); use email + password
#     (the confirmation link is printed in: docker compose logs memecreator)
services:
  postgres:
    volumes:
      - postgres-data:/var/lib/postgresql/data

  aiproxy:
    build: ${AIPROXY_DIR:-../../aiproxy}
    environment:
      GROQ_ENABLED: ${GROQ_ENABLED:-false}   # set GROQ_ENABLED=true + GROQ_API_KEY in deploy/.env to get the Groq fallback

  memecreator:
    volumes:
      - memecreator-data:/data
      - ${MEME_TEMPLATES_HOST:?set MEME_TEMPLATES_HOST in deploy/.env}:/data/templates
      - ${MEME_STORAGE_HOST:?set MEME_STORAGE_HOST in deploy/.env}:/data/meme-storage

  web:
    ports:
      - "127.0.0.1:8088:80"

volumes:
  postgres-data:
  memecreator-data:
