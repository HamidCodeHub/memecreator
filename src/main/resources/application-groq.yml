# Call Groq directly instead of the aiproxy gateway.
# Activate with: --spring.profiles.active=groq   (or SPRING_PROFILES_ACTIVE=groq)
ai-gateway:
  base-url: https://api.groq.com/openai
  chat-path: /v1/chat/completions
  api-key: ${GROQ_API_KEY}
  model: openai/gpt-oss-120b
  temperature: 1.0          # gpt-oss is tuned for temperature 1.0; it also helps the jokes vary
  max-tokens: 1536          # reasoning + answer share this budget; free tier: prompt + max_tokens <= 8,000/min
  vision-max-tokens: 1536
  reasoning-effort: low     # low = fast; medium/high rarely makes captions funnier
  vision-model: qwen/qwen3.8-27b
  image-format: openai      # Groq expects {"type":"image_url","image_url":{"url":...}}
  read-timeout: 60s
