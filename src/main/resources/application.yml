server:
  port: 8081   # the AI gateway usually sits on 8080

spring:
  application:
    name: memecreator
  servlet:
    multipart:
      max-file-size: 10MB          # photo uploads (POST /api/memes/from-image)
      max-request-size: 11MB

meme:
  templates-dir: E:/photos/meme
  output-dir: E:/Work/memecreator/output
  count: 4
  default-language: English   # used when a request doesn't pass "language"
  # First installed font wins. Impact is the classic meme font (ships with Windows).
  fonts: [Impact, Anton, Arial Black, Arial]
  jpeg-quality: 0.92
  # Where captions go on each template (text boxes + what each box means). Re-read when it changes.
  layouts-file: classpath:template-layouts.yml

ai-gateway:
  base-url: ${AI_GATEWAY_URL:http://localhost:8080}
  chat-path: /v1/chat/completions      # OpenAI-compatible chat completions endpoint
  models-path: /v1/models              # used by GET /api/ai/models
  # aiproxy dev key, sent as "Authorization: Bearer <key>". Set AI_GATEWAY_API_KEY to override; never use in prod.
  api-key: ${AI_GATEWAY_API_KEY:aip_dev_user_key_do_not_use_in_prod}
  # Full "provider/model" id. Groq shut down llama-3.3-70b-versatile (Aug 2026); aiproxy still lists it and then
  # silently falls back to mock/mock-fast. gpt-oss-120b isn't in aiproxy's catalogue, but aiproxy routes
  # unregistered "provider/model" ids (allow-unregistered-models: true).
  model: ${AI_GATEWAY_MODEL:groq/openai/gpt-oss-120b}
  temperature: 1.0                     # gpt-oss is tuned for 1.0
  max-tokens: 2000                     # gpt-oss reasoning + answer share this budget
  # Top-level "reasoning_effort" is only for calling an OpenAI-style API directly (see application-groq.yml).
  # aiproxy rejects it; through aiproxy use provider-options below instead.
  reasoning-effort:
  provider-options:
    groq:
      "[reasoning_effort]": low        # brackets keep the underscore in the key
  json-mode: true                      # send response_format json_object (model needs the json_mode capability)
  # Photo memes need a model that can read images. Groq's free vision model; copy the exact id from the Groq
  # console if it changes. It has its own rate limits, separate from the text model.
  vision-model: ${AI_GATEWAY_VISION_MODEL:groq/qwen/qwen3.8-27b}
  vision-max-tokens: 3000              # Qwen may "think" before answering; thinking + answer share this budget
  image-format: aiproxy                # aiproxy's image message format; "openai" when calling Groq directly
  # vision-provider-options:           # e.g. to turn Qwen's thinking off if it runs out of tokens:
  #   groq:
  #     "[reasoning_effort]": none
  connect-timeout: 5s
  read-timeout: 90s

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
  api-docs:
    path: /v3/api-docs

logging:
  level:
    com.memecreator: INFO
