# Where captions go on each template, and what each text box means (the AI sees the hints).
#
#   "<template name>":            # matched to the file name after "<id>_", ignoring case and punctuation
#     usage: how the format works (optional, shown to the AI)
#     boxes:                      # one entry per text the AI writes, in order
#       - [x, y, width, height, color, valign, "hint"]
#
#   x, y, width, height  fractions of the image (0..1), measured from the top-left corner
#   color                white = white text with black outline (on photos)
#                        black = plain black text (on white or light areas)
#   valign               top | middle | bottom (where the text sits inside its box)
#
#     faces:                      # optional: where a user's face can be pasted (POST /api/memes/with-face)
#       - [x, y, w, h, rex, rey, lex, ley, nx, ny, rmx, rmy, lmx, lmy]
#
#   faces: face box, then 5 landmarks as fractions of the image: the two eyes, the nose tip and the two mouth
#          corners, as found by OpenCV's YuNet face detector. The user's face is aligned to these points.
#          Only photo templates have faces; numbered in reading order (top to bottom, left to right).
#
# Templates not listed here get the classic layout: top text + bottom text, and no face slots.
# An entry may have only "faces:" and no "boxes:"; it then keeps the classic top/bottom captions.
# Check a layout visually with GET /api/templates/preview?name=<template>; this file is re-read
# when it changes (in IntelliJ: edit target/classes copy, or rebuild with Ctrl+F9).

default:
  boxes:
    - [0.03, 0.02, 0.94, 0.26, white, top, "top text"]
    - [0.03, 0.72, 0.94, 0.26, white, bottom, "bottom text"]

# The same meme under other names, when you'd rather not delete the extra files. The template on the left is kept;
# the names in its list are hidden from the AI, random picks and the gallery, and asking for one of them by name gives
# the kept one. Keep the name that best describes the joke. Matched like layouts (case and punctuation ignored), e.g.
#   "Drake Hotline Bling": ["Drake Blank", "No - Yes"]
